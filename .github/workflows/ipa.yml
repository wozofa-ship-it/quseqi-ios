name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild -project QuSeQi.xcodeproj \
            -scheme QuSeQi \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/QuSeQi.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/QuSeQi.xcarchive/Products/Applications/QuSeQi.app" Payload/
          zip -r QuSeQi-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuSeQi-unsigned-ipa
          path: QuSeQi-unsigned.ipa
